<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="880" fill="#ffffff"/>
  <style>
    .box{fill:#f6f7f9;stroke:#3a3f47;stroke-width:2}
    .xiao{fill:#1f2a36;stroke:#0f151c;stroke-width:2}
    .t{font-size:14px;fill:#1f2328}
    .ts{font-size:12px;fill:#4a5260}
    .tw{font-size:13px;fill:#ffffff}
    .tb{font-size:16px;font-weight:bold;fill:#1f2328}
    .pin{font-size:13px;font-weight:bold;fill:#ffffff}
    .w{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
    .dot{stroke:#fff;stroke-width:1.5}
    .flag5{font-size:11px;font-weight:bold;fill:#fff}
  </style>

  <text x="40" y="44" class="tb" font-size="22">Calios parrot MVP: wiring</text>
  <text x="40" y="68" class="ts">Signal wires are drawn. Power goes through the breadboard rails (top right): every red 5V tag goes to the + rail and every black GND tag goes to the − rail.</text>

  <!-- Power bank -->
  <rect x="530" y="92" width="160" height="50" rx="8" class="box"/>
  <text x="610" y="114" text-anchor="middle" class="t">USB-C power bank</text>
  <text x="610" y="132" text-anchor="middle" class="ts">(laptop when flashing)</text>
  <path d="M610 142 V185" class="w" stroke="#3a3f47"/>

  <!-- XIAO -->
  <rect x="595" y="182" width="30" height="16" rx="3" fill="#9aa3ad"/>
  <rect x="520" y="196" width="180" height="310" rx="10" class="xiao"/>
  <text x="610" y="337" text-anchor="middle" class="tw" font-weight="bold">XIAO</text>
  <text x="610" y="355" text-anchor="middle" class="tw" font-weight="bold">ESP32S3</text>
  <text x="610" y="373" text-anchor="middle" class="tw" font-weight="bold">Sense</text>
  <text x="610" y="526" text-anchor="middle" class="ts">Camera + mic are on the clip-on</text>
  <text x="610" y="542" text-anchor="middle" class="ts">Sense board: no wiring needed</text>
  <!-- left pins -->
  <g class="pin">
    <text x="530" y="235">D0</text><text x="530" y="275">D1</text><text x="530" y="315">D2</text>
    <text x="530" y="355">D3</text><text x="530" y="395">D4</text><text x="530" y="435">D5</text><text x="530" y="475">D6</text>
  </g>
  <!-- right pins -->
  <g class="pin" text-anchor="end">
    <text x="690" y="235">5V</text><text x="690" y="275">GND</text><text x="690" y="315">3V3</text>
    <text x="690" y="355">D10</text><text x="690" y="395">D9</text><text x="690" y="435">D8</text><text x="690" y="475">D7</text>
  </g>
  <text x="712" y="315" class="ts">not used</text>
  <text x="712" y="395" class="ts">D8–D10 free</text>
  <text x="712" y="411" class="ts">(shared with microSD;</text>
  <text x="712" y="427" class="ts">keep the slot empty)</text>

  <!-- ===== D0: touch pad ===== -->
  <path d="M520 230 H262" class="w" stroke="#e07b00"/>
  <rect x="180" y="198" width="80" height="50" rx="4" fill="#d9894a" stroke="#9c5a22" stroke-width="2"/>
  <text x="220" y="228" text-anchor="middle" class="tw" font-size="12">copper tape</text>
  <text x="40" y="214" class="t">Touch pad</text>
  <text x="40" y="232" class="ts">inside the head,</text>
  <text x="40" y="248" class="ts">~2 × 2 cm</text>
  <text x="300" y="222" class="ts">GPIO1 (touch ch. 1)</text>

  <!-- ===== D1: NeoPixels ===== -->
  <path d="M520 270 H252" class="w" stroke="#2a9d4b"/>
  <rect x="170" y="258" width="80" height="44" rx="6" class="box"/>
  <circle cx="190" cy="280" r="9" fill="#bfe8c8" stroke="#2a9d4b" stroke-width="2"/>
  <text x="206" y="276" class="ts">in →</text><text x="206" y="292" class="ts">← out</text>
  <path d="M170 288 H140 V368 H168" class="w" stroke="#2a9d4b"/>
  <rect x="170" y="346" width="80" height="44" rx="6" class="box"/>
  <circle cx="230" cy="368" r="9" fill="#f4c2c2" stroke="#c0392b" stroke-width="2"/>
  <text x="176" y="372" class="ts">→ in</text>
  <text x="40" y="276" class="t">Status LED</text>
  <text x="40" y="292" class="ts">NeoPixel #0</text>
  <text x="40" y="364" class="t">Privacy LED</text>
  <text x="40" y="380" class="ts">NeoPixel #1,</text>
  <text x="40" y="396" class="ts">next to the camera</text>
  <g><rect x="258" y="282" width="34" height="15" rx="3" fill="#d62828"/><text x="275" y="293" text-anchor="middle" class="flag5">5V</text>
     <rect x="296" y="282" width="38" height="15" rx="3" fill="#222"/><text x="315" y="293" text-anchor="middle" class="flag5">GND</text></g>
  <g><rect x="258" y="372" width="34" height="15" rx="3" fill="#d62828"/><text x="275" y="383" text-anchor="middle" class="flag5">5V</text>
     <rect x="296" y="372" width="38" height="15" rx="3" fill="#222"/><text x="315" y="383" text-anchor="middle" class="flag5">GND</text></g>

  <!-- ===== D2 / D3: servos (route left, down, under everything) ===== -->
  <path d="M520 310 H380 V790 H818" class="w" stroke="#7b4bd6"/>
  <path d="M520 350 H396 V725 H818" class="w" stroke="#2d6cdf"/>

  <!-- ===== D4/D5/D6: I2S to amp ===== -->
  <path d="M520 390 H430 V598" class="w" stroke="#0f9fb0"/>
  <path d="M520 430 H460 V598" class="w" stroke="#d63fa0"/>
  <path d="M520 470 H490 V598" class="w" stroke="#9a6a2f"/>
  <!-- D7: amp SD, from the right side under the board -->
  <path d="M700 470 H735 V566 H600 V598" class="w" stroke="#6b7280"/>

  <!-- Amp -->
  <rect x="408" y="600" width="232" height="92" rx="8" class="box"/>
  <text x="430" y="618" text-anchor="middle" class="ts">BCLK</text>
  <text x="460" y="634" text-anchor="middle" class="ts">LRC</text>
  <text x="490" y="618" text-anchor="middle" class="ts">DIN</text>
  <text x="600" y="618" text-anchor="middle" class="ts">SD</text>
  <text x="524" y="662" text-anchor="middle" class="t" font-weight="bold">MAX98357A amp</text>
  <text x="524" y="680" text-anchor="middle" class="ts">GAIN: leave unconnected</text>
  <g><rect x="414" y="698" width="48" height="15" rx="3" fill="#d62828"/><text x="438" y="709" text-anchor="middle" class="flag5">Vin 5V</text>
     <rect x="466" y="698" width="38" height="15" rx="3" fill="#222"/><text x="485" y="709" text-anchor="middle" class="flag5">GND</text></g>
  <!-- speaker -->
  <path d="M640 630 H690" class="w" stroke="#d62828"/>
  <path d="M640 662 H690" class="w" stroke="#222"/>
  <path d="M692 620 h18 l22 -18 v88 l-22 -18 h-18 z" fill="#e9ecf0" stroke="#3a3f47" stroke-width="2"/>
  <text x="652" y="624" class="ts">+</text><text x="652" y="657" class="ts">−</text>
  <text x="745" y="640" class="t">Speaker</text>
  <text x="745" y="656" class="ts">8 Ω 1 W, screw terminals</text>

  <!-- Servos -->
  <rect x="820" y="700" width="170" height="50" rx="8" class="box"/>
  <text x="905" y="722" text-anchor="middle" class="t" font-weight="bold">Head-tilt servo</text>
  <text x="905" y="740" text-anchor="middle" class="ts">SG92R · orange = signal</text>
  <rect x="820" y="765" width="170" height="50" rx="8" class="box"/>
  <text x="905" y="787" text-anchor="middle" class="t" font-weight="bold">Beak servo</text>
  <text x="905" y="805" text-anchor="middle" class="ts">SG92R · orange = signal</text>
  <g><rect x="998" y="710" width="50" height="15" rx="3" fill="#d62828"/><text x="1023" y="721" text-anchor="middle" class="flag5">red 5V</text>
     <rect x="1052" y="710" width="70" height="15" rx="3" fill="#222"/><text x="1087" y="721" text-anchor="middle" class="flag5">brown GND</text></g>
  <g><rect x="998" y="775" width="50" height="15" rx="3" fill="#d62828"/><text x="1023" y="786" text-anchor="middle" class="flag5">red 5V</text>
     <rect x="1052" y="775" width="70" height="15" rx="3" fill="#222"/><text x="1087" y="786" text-anchor="middle" class="flag5">brown GND</text></g>

  <!-- Wire labels -->
  <g class="ts">
    <text x="300" y="262">GPIO2</text>
    <text x="400" y="304">D2 → beak</text>
    <text x="410" y="344">D3 → head</text>
    <text x="436" y="384">GPIO5</text>
    <text x="466" y="424">GPIO6</text>
    <text x="466" y="464">GPIO43</text>
    <text x="742" y="466">GPIO44</text>
  </g>

  <!-- ===== Power panel ===== -->
  <rect x="790" y="150" width="380" height="245" rx="10" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="808" y="174" class="t" font-weight="bold">Breadboard power rails</text>
  <path d="M700 230 H860" class="w" stroke="#d62828"/>
  <path d="M700 270 H860" class="w" stroke="#222"/>
  <path d="M860 230 H1150" stroke="#d62828" stroke-width="7" stroke-linecap="round"/>
  <path d="M860 270 H1150" stroke="#222" stroke-width="7" stroke-linecap="round"/>
  <text x="1150" y="220" text-anchor="end" class="ts" fill="#d62828">+ rail (5V)</text>
  <text x="1150" y="292" text-anchor="end" class="ts">− rail (GND)</text>
  <!-- caps -->
  <g>
    <path d="M905 230 V243 M905 257 V270" stroke="#3a3f47" stroke-width="2"/>
    <path d="M895 243 H915 M895 257 Q905 251 915 257" stroke="#3a3f47" stroke-width="2.5" fill="none"/>
    <path d="M955 230 V243 M955 257 V270" stroke="#3a3f47" stroke-width="2"/>
    <path d="M945 243 H965 M945 257 Q955 251 965 257" stroke="#3a3f47" stroke-width="2.5" fill="none"/>
    <text x="975" y="254" class="ts">2 × 220 µF, next to the servos</text>
  </g>
  <text x="808" y="318" class="ts">+ rail: servo red ×2, amp Vin, NeoPixel + ×2</text>
  <text x="808" y="336" class="ts">− rail: servo brown ×2, amp GND, NeoPixel − ×2</text>
  <text x="808" y="360" class="ts">Caps: long leg (+) to the + rail, striped side (−) to the − rail.</text>
  <text x="808" y="378" class="ts">If the board resets when servos move, see "Power" in WIRING.md.</text>

  <!-- Legend -->
  <g class="ts">
    <text x="40" y="440" class="t" font-weight="bold">Wire colors (suggested)</text>
    <rect x="40" y="452" width="22" height="5" fill="#e07b00"/><text x="70" y="459">touch</text>
    <rect x="40" y="470" width="22" height="5" fill="#2a9d4b"/><text x="70" y="477">NeoPixel data</text>
    <rect x="40" y="488" width="22" height="5" fill="#7b4bd6"/><text x="70" y="495">beak servo</text>
    <rect x="40" y="506" width="22" height="5" fill="#2d6cdf"/><text x="70" y="513">head servo</text>
    <rect x="200" y="452" width="22" height="5" fill="#0f9fb0"/><text x="230" y="459">I2S BCLK</text>
    <rect x="200" y="470" width="22" height="5" fill="#d63fa0"/><text x="230" y="477">I2S LRC</text>
    <rect x="200" y="488" width="22" height="5" fill="#9a6a2f"/><text x="230" y="495">I2S DIN</text>
    <rect x="200" y="506" width="22" height="5" fill="#6b7280"/><text x="230" y="513">amp SD</text>
  </g>
</svg>
